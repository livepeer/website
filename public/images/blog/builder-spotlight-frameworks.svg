<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FrameWorks — a vertically integrated live video stack built on Livepeer's open compute layer">
  <!-- Surface -->
  <rect width="1200" height="675" fill="#1c1c1c"/>

  <!-- Self-contained platform boundary (secondary linework) -->
  <rect x="400" y="110" width="400" height="460" rx="8" stroke="#1e9960" stroke-width="1.5" opacity="0.35"/>

  <!-- Signal threading the full stack: encoder -> viewer (drawn behind layers) -->
  <line x1="600" y1="86" x2="600" y2="588" stroke="#40bf86" stroke-width="2" opacity="0.7"/>

  <!-- Stack layers: ingest / transcode / compute / delivery / player -->
  <!-- standard layers -->
  <g stroke="#40bf86" stroke-width="2.5">
    <rect x="440" y="130" width="320" height="64" rx="4" fill="#1e9960" fill-opacity="0.10"/>
    <rect x="440" y="218" width="320" height="64" rx="4" fill="#1e9960" fill-opacity="0.10"/>
    <rect x="440" y="394" width="320" height="64" rx="4" fill="#1e9960" fill-opacity="0.10"/>
    <rect x="440" y="482" width="320" height="64" rx="4" fill="#1e9960" fill-opacity="0.10"/>
  </g>

  <!-- focal layer: Livepeer open GPU compute, heaviest weight + brightest fill -->
  <rect x="440" y="306" width="320" height="64" rx="4" fill="#40bf86" fill-opacity="0.15" stroke="#40bf86" stroke-width="3.5"/>

  <!-- Signal nodes at each layer (on top) -->
  <g fill="#40bf86">
    <circle cx="600" cy="162" r="4"/>
    <circle cx="600" cy="250" r="4"/>
    <circle cx="600" cy="426" r="4"/>
    <circle cx="600" cy="514" r="4"/>
  </g>
  <!-- focal node -->
  <circle cx="600" cy="338" r="9" fill="#1c1c1c" stroke="#40bf86" stroke-width="3.5"/>
  <circle cx="600" cy="338" r="3" fill="#40bf86"/>

  <!-- Origin (encoder) and terminus (viewer) -->
  <circle cx="600" cy="86" r="4" fill="#40bf86"/>
  <path d="M590 578 L610 578 L600 594 Z" fill="#40bf86"/>
</svg>
