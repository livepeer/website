<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#1c1c1c"/>

  <!-- All cascade content scaled down and recentered within the frame -->
  <g transform="translate(120, 56.7) scale(0.8)">

  <!-- Source point above the cascade — single input entering from above -->
  <line x1="600" y1="80" x2="600" y2="130" stroke="#1e9960" stroke-width="1.5" opacity="0.6"/>
  <circle cx="600" cy="76" r="5" fill="#40bf86"/>
  <circle cx="600" cy="76" r="10" stroke="#40bf86" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- ============ TIER 1 — source (narrowest) ============ -->
  <rect x="510" y="130" width="180" height="46" rx="7" stroke="#40bf86" stroke-width="2.5" fill="none"/>
  <line x1="510" y1="153" x2="690" y2="153" stroke="#1e9960" stroke-width="1" opacity="0.45"/>

  <!-- Cascade flow: tier 1 → tier 2 (left + right spill) -->
  <path d="M510,176 C492,206 478,236 470,268" stroke="#40bf86" stroke-width="2.5" fill="none" opacity="0.9" stroke-linecap="round"/>
  <path d="M690,176 C708,206 722,236 730,268" stroke="#40bf86" stroke-width="2.5" fill="none" opacity="0.9" stroke-linecap="round"/>
  <!-- Center trickle: data flowing straight down as the primary thread -->
  <line x1="600" y1="176" x2="600" y2="268" stroke="#1e9960" stroke-width="1.5" opacity="0.35" stroke-dasharray="3 4"/>
  <!-- Particles in flow 1 -->
  <circle cx="502" cy="200" r="3" fill="#40bf86" opacity="0.9"/>
  <circle cx="493" cy="226" r="2.5" fill="#1e9960" opacity="0.75"/>
  <circle cx="484" cy="252" r="2" fill="#40bf86" opacity="0.55"/>
  <circle cx="698" cy="200" r="3" fill="#40bf86" opacity="0.9"/>
  <circle cx="707" cy="226" r="2.5" fill="#1e9960" opacity="0.75"/>
  <circle cx="716" cy="252" r="2" fill="#40bf86" opacity="0.55"/>

  <!-- ============ TIER 2 ============ -->
  <rect x="465" y="268" width="270" height="52" rx="8" stroke="#40bf86" stroke-width="2.75" fill="none"/>
  <line x1="465" y1="290" x2="735" y2="290" stroke="#1e9960" stroke-width="1" opacity="0.5"/>
  <line x1="465" y1="306" x2="735" y2="306" stroke="#1e9960" stroke-width="1" opacity="0.5"/>
  <line x1="555" y1="268" x2="555" y2="320" stroke="#1e9960" stroke-width="1" opacity="0.35"/>
  <line x1="645" y1="268" x2="645" y2="320" stroke="#1e9960" stroke-width="1" opacity="0.35"/>

  <!-- Cascade flow: tier 2 → tier 3 -->
  <path d="M465,320 C443,354 422,388 405,420" stroke="#40bf86" stroke-width="2.75" fill="none" opacity="0.9" stroke-linecap="round"/>
  <path d="M735,320 C757,354 778,388 795,420" stroke="#40bf86" stroke-width="2.75" fill="none" opacity="0.9" stroke-linecap="round"/>
  <line x1="600" y1="320" x2="600" y2="420" stroke="#1e9960" stroke-width="1.5" opacity="0.35" stroke-dasharray="3 4"/>
  <!-- Particles in flow 2 (more + larger — building intensity) -->
  <circle cx="455" cy="345" r="3.5" fill="#40bf86" opacity="0.9"/>
  <circle cx="443" cy="375" r="3" fill="#1e9960" opacity="0.75"/>
  <circle cx="431" cy="403" r="2.5" fill="#40bf86" opacity="0.55"/>
  <circle cx="745" cy="345" r="3.5" fill="#40bf86" opacity="0.9"/>
  <circle cx="757" cy="375" r="3" fill="#1e9960" opacity="0.75"/>
  <circle cx="769" cy="403" r="2.5" fill="#40bf86" opacity="0.55"/>

  <!-- ============ TIER 3 ============ -->
  <rect x="400" y="420" width="400" height="58" rx="9" stroke="#40bf86" stroke-width="3" fill="none"/>
  <line x1="400" y1="443" x2="800" y2="443" stroke="#40bf86" stroke-width="1" opacity="0.55"/>
  <line x1="400" y1="461" x2="800" y2="461" stroke="#40bf86" stroke-width="1" opacity="0.55"/>
  <line x1="500" y1="420" x2="500" y2="478" stroke="#1e9960" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="420" x2="600" y2="478" stroke="#1e9960" stroke-width="1" opacity="0.4"/>
  <line x1="700" y1="420" x2="700" y2="478" stroke="#1e9960" stroke-width="1" opacity="0.4"/>

  <!-- Cascade flow: tier 3 → tier 4 -->
  <path d="M400,478 C376,514 352,550 335,586" stroke="#40bf86" stroke-width="3" fill="none" opacity="0.9" stroke-linecap="round"/>
  <path d="M800,478 C824,514 848,550 865,586" stroke="#40bf86" stroke-width="3" fill="none" opacity="0.9" stroke-linecap="round"/>
  <line x1="600" y1="478" x2="600" y2="586" stroke="#1e9960" stroke-width="1.5" opacity="0.35" stroke-dasharray="3 4"/>
  <!-- Particles in flow 3 (even more + denser) -->
  <circle cx="389" cy="504" r="4" fill="#40bf86" opacity="0.9"/>
  <circle cx="374" cy="536" r="3.5" fill="#1e9960" opacity="0.75"/>
  <circle cx="359" cy="568" r="3" fill="#40bf86" opacity="0.55"/>
  <circle cx="811" cy="504" r="4" fill="#40bf86" opacity="0.9"/>
  <circle cx="826" cy="536" r="3.5" fill="#1e9960" opacity="0.75"/>
  <circle cx="841" cy="568" r="3" fill="#40bf86" opacity="0.55"/>

  <!-- ============ TIER 4 — widest, most detailed (built intensity) ============ -->
  <rect x="330" y="586" width="540" height="0" rx="0" fill="none"/>
  <rect x="330" y="586" width="540" height="40" rx="8" stroke="#40bf86" stroke-width="3.25" fill="none"/>
  <line x1="330" y1="600" x2="870" y2="600" stroke="#40bf86" stroke-width="1.2" opacity="0.65"/>
  <line x1="330" y1="612" x2="870" y2="612" stroke="#40bf86" stroke-width="1.2" opacity="0.65"/>
  <line x1="465" y1="586" x2="465" y2="626" stroke="#40bf86" stroke-width="1" opacity="0.45"/>
  <line x1="600" y1="586" x2="600" y2="626" stroke="#40bf86" stroke-width="1" opacity="0.45"/>
  <line x1="735" y1="586" x2="735" y2="626" stroke="#40bf86" stroke-width="1" opacity="0.45"/>

  </g>
</svg>
