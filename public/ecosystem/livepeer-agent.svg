<!--
  Padded, square viewBox. Two corrections in one box.

  Size: the raw mark is flush to its own viewBox, so it rendered at 99% of the
  tile against 75–85% for the marks in this set that carry their own margin.
  Padding brings it to 82%.

  Position: the mark's ink sits left of its bounding centre — three squares in
  the left column, two in the middle, one on the right — so a true centre reads
  as leaning left. Tuned by eye across three passes: +6.00u still read left,
  the full centroid correction of +9.48u overshot, and +7.80u still sat at
  +8.5% of the box against ~0% for every other logo here. This is +2.5%,
  a nudge rather than a correction.
-->
